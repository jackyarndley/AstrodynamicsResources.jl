name: Discover resources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Run network-light discovery
        shell: bash
        run: |
          set +e
          julia --project=. scripts/discover_naif_planets.jl
          julia --project=. scripts/discover_naif_satellites.jl
          julia --project=. scripts/discover_naif_support.jl
          julia --project=. scripts/discover_naif_dsk.jl
          julia --project=. scripts/discover_gravity_models.jl
          mkdir -p catalog/generated/reports
          cp build/reports/*.toml catalog/generated/reports/ 2>/dev/null || true
      - name: Open review pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/resource-discovery
          delete-branch: true
          title: "Resource discovery report"
          commit-message: "Update resource discovery reports"
          body: |
            Automated discovery only. No aliases, bundle membership, immutable
            bindings, licensing decisions, or publication actions were changed.
            Additions, removals, and integrity events require human review.

