name: Cache resources

on:
  push:
    branches: [main]
    paths:
      - catalog/*.toml
      - scripts/catalog.jl
      - scripts/resource_release.jl
      - scripts/release_audit.jl
      - scripts/lib/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resource-cache
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scan.outputs.build }}
      build_count: ${{ steps.scan.outputs.build_count }}
      adopt: ${{ steps.scan.outputs.adopt }}
      adopt_count: ${{ steps.scan.outputs.adopt_count }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Compare declarations with canonical release assets
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > release-assets.txt
          while read -r RELEASE; do
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id' 2>/dev/null || true)
            [ -z "$RELEASE_ID" ] && continue
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq '.[].name' |
              while read -r ASSET; do printf '%s\t%s\n' "$RELEASE" "$ASSET"; done
          done < <(julia --project=. scripts/resource_release.jl tags)
          sort -u -o release-assets.txt release-assets.txt
          julia --project=. scripts/release_audit.jl release-assets.txt

  prepare:
    needs: scan
    if: needs.scan.outputs.build_count != '0' || needs.scan.outputs.adopt_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Ensure canonical releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r RELEASE TITLE; do
            if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --target main --latest=false --title "$TITLE" \
                --notes "Immutable data assets for the $TITLE resource family."
            fi
          done < <(julia --project=. scripts/resource_release.jl releases)

  build:
    needs: [scan, prepare]
    if: needs.scan.outputs.build_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        name: ${{ fromJSON(needs.scan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - uses: julia-actions/cache@v3.2.0
      - uses: actions/cache@v6.1.0
        with:
          path: build/source-cache
          key: source-${{ matrix.name }}
      - name: Instantiate
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build deterministic archive
        env:
          ASTRODYNAMICS_RESOURCES_DOWNLOAD_ATTEMPTS: "8"
        run: julia --project=scripts scripts/catalog.jl build "${{ matrix.name }}"
      - name: Publish without overwriting immutable bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE=$(julia --project=. scripts/resource_release.jl tag "${{ matrix.name }}")
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id')
          ASSET="build/artifacts/${{ matrix.name }}.tar.gz"
          NAME=$(basename "$ASSET")
          REMOTE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq ".[] | select(.name == \"$NAME\") | .digest")
          LOCAL="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
          if [ -n "$REMOTE" ]; then
            test "$REMOTE" = "$LOCAL"
          else
            gh release upload "$RELEASE" "$ASSET" --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: resource-report-${{ matrix.name }}
          path: build/reports/${{ matrix.name }}.toml
          retention-days: 1

  adopt:
    needs: [scan, prepare]
    if: needs.scan.outputs.adopt_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        name: ${{ fromJSON(needs.scan.outputs.adopt) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Verify existing release archive and recover hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE=$(julia --project=. scripts/resource_release.jl tag "${{ matrix.name }}")
          mkdir -p build/adopted build/extracted
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.name }}.tar.gz" --dir build/adopted
          tar -xzf "build/adopted/${{ matrix.name }}.tar.gz" -C build/extracted
          julia --project=scripts scripts/catalog.jl adopt \
            "${{ matrix.name }}" \
            "build/adopted/${{ matrix.name }}.tar.gz" \
            build/extracted
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: resource-report-${{ matrix.name }}
          path: build/reports/${{ matrix.name }}.toml
          retention-days: 1

  update-catalogue:
    needs: [scan, build, adopt]
    if: always() && needs.scan.result == 'success' && (needs.scan.outputs.build_count != '0' || needs.scan.outputs.adopt_count != '0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: resource-report-*
          path: build/reports
          merge-multiple: true
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Inline hashes for every successful resource
        shell: bash
        run: |
          if compgen -G "build/reports/*.toml" >/dev/null; then
            julia --project=. scripts/catalog.jl update build/reports
            julia --project=. scripts/catalog.jl validate
          else
            echo "No successful resource reports were produced."
          fi
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/resource-metadata
          delete-branch: true
          title: "Record cached resource hashes"
          commit-message: "Record cached resource hashes"
          body: |
            Records source, archive, and artifact-tree hashes directly in each
            successful resource declaration. No separate resource lock files are used.

            Successful matrix members are recorded even when another resource fails,
            so already-published assets are not rebuilt on the next workflow run.
