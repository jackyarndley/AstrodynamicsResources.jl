name: Cache resources

on:
  push:
    branches: [main]
    paths:
      - catalog/*.toml
      - scripts/catalog.jl
      - scripts/resource_release.jl
      - scripts/release_audit.jl
      - scripts/lib/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: resource-cache
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      uncached: ${{ steps.scan.outputs.uncached }}
      uncached_count: ${{ steps.scan.outputs.uncached_count }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Compare catalogue with canonical releases
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > release-assets.txt
          while read -r RELEASE; do
            gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' 2>/dev/null | \
              while read -r ASSET; do printf '%s\t%s\n' "$RELEASE" "$ASSET"; done || true
          done < <(julia --project=. scripts/resource_release.jl tags)
          sort -u -o release-assets.txt release-assets.txt
          julia --project=. scripts/release_audit.jl release-assets.txt

  prepare:
    needs: scan
    if: needs.scan.outputs.uncached_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Ensure canonical releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r RELEASE TITLE; do
            if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --target main --latest=false --title "$TITLE" \
                --notes "Immutable data assets for the $TITLE resource family."
            fi
          done < <(julia --project=. scripts/resource_release.jl releases)

  build:
    needs: [scan, prepare]
    if: needs.scan.outputs.uncached_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        name: ${{ fromJSON(needs.scan.outputs.uncached) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - uses: julia-actions/cache@v3.2.0
      - uses: actions/cache@v6.1.0
        with:
          path: build/source-cache
          key: source-${{ matrix.name }}
      - name: Instantiate
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build deterministic archive
        env:
          ASTRODYNAMICS_RESOURCES_DOWNLOAD_ATTEMPTS: "8"
        run: julia --project=scripts scripts/catalog.jl build "${{ matrix.name }}"
      - name: Publish to canonical release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RESOURCE_RELEASE=$(julia --project=. scripts/resource_release.jl tag "${{ matrix.name }}")
          ASSET="build/artifacts/${{ matrix.name }}.tar.gz"
          NAME=$(basename "$ASSET")
          REMOTE=$(gh release view "$RESOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ".assets[] | select(.name == \"$NAME\") | .digest")
          LOCAL="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
          if [ -n "$REMOTE" ]; then
            test "$REMOTE" = "$LOCAL"
          else
            gh release upload "$RESOURCE_RELEASE" "$ASSET" --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: resource-report-${{ matrix.name }}
          path: build/reports/${{ matrix.name }}.toml
          retention-days: 1

  update-lock:
    needs: [scan, build]
    if: always() && needs.scan.outputs.uncached_count != '0' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: resource-report-*
          path: build/reports
          merge-multiple: true
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Generate lock and artifact bindings by release family
        shell: bash
        run: |
          mkdir -p build/reports-by-release
          for REPORT in build/reports/*.toml; do
            NAME=$(basename "$REPORT" .toml)
            RELEASE=$(julia --project=. scripts/resource_release.jl tag "$NAME")
            mkdir -p "build/reports-by-release/$RELEASE"
            cp "$REPORT" "build/reports-by-release/$RELEASE/"
          done

          while read -r RELEASE; do
            DIR="build/reports-by-release/$RELEASE"
            if [ -d "$DIR" ] && compgen -G "$DIR/*.toml" >/dev/null; then
              julia --project=. scripts/catalog.jl update-lock "$DIR" \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}"
            fi
          done < <(julia --project=. scripts/resource_release.jl tags)

          julia --project=. scripts/catalog.jl validate
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: automation/resource-lock
          delete-branch: true
          title: "Lock newly cached resources"
          commit-message: "Lock newly cached resources"
          body: |
            Generated immutable hashes and lazy Julia artifact bindings for new
            declarations, with each asset published in its canonical resource release.
