name: Release checks

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ASTRODYNAMICS_RESOURCES_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Test package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Validate registration metadata
        run: |
          julia --project=. scripts/validate_catalog.jl
          test -f LICENSE
          test -f CITATION.cff
          test -f CHANGELOG.md

