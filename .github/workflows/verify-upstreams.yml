name: Verify upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 4"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Validate local integrity
        run: julia --project=. scripts/validate_catalog.jl
      - name: Verify pinned upstream indexes
        run: |
          julia --project=. scripts/discover_naif_planets.jl
          julia --project=. scripts/discover_naif_satellites.jl
          julia --project=. scripts/discover_naif_support.jl
      - name: Probe live endpoints
        run: julia --project=. scripts/verify_live_sources.jl
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-verification-report
          path: build/reports
          retention-days: 14

