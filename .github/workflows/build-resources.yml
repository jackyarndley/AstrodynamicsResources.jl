name: Build immutable resource

on:
  workflow_dispatch:
    inputs:
      resource_id:
        description: Exact reviewed resource ID
        required: true
        type: string
      mode:
        description: Hash an unpinned source or build a pinned artifact
        required: true
        default: build
        type: choice
        options:
          - build
          - hash

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - uses: julia-actions/cache@v3.2.0
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = "PRIVATE"
      - name: Instantiate packaging environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Restore verified upstream source cache
        uses: actions/cache@v6.1.0
        with:
          path: build/source-cache
          key: source-${{ inputs.resource_id }}
          restore-keys: |
            source-${{ inputs.resource_id }}-
      - name: Build and verify deterministic artifact
        if: inputs.mode == 'build'
        run: julia --project=scripts scripts/build_artifact.jl "${{ inputs.resource_id }}"
      - name: Hash and cache authoritative source
        if: inputs.mode == 'hash'
        run: julia --project=scripts scripts/update_source_hashes.jl "${{ inputs.resource_id }}"
      - name: Preserve source-hash report
        if: inputs.mode == 'hash'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-hash-${{ inputs.resource_id }}
          path: build/reports/source-hashes/*.toml
          if-no-files-found: error
      - name: Read build identity
        if: inputs.mode == 'build'
        id: identity
        shell: bash
        run: |
          REPORT=$(find build/reports/artifacts -name '*.toml' -type f | head -1)
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          julia --project=. -e '
            using TOML
            r = TOML.parsefile(ARGS[1])
            println("source_sha=", r["source_sha256"])
            println("archive=", r["archive_path"])
          ' "$REPORT" >> "$GITHUB_OUTPUT"
      - name: Publish immutable release asset
        if: inputs.mode == 'build'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="resources-v1"
          ASSET="${{ steps.identity.outputs.archive }}"
          NAME=$(basename "$ASSET")
          REPORT="${{ steps.identity.outputs.report }}"
          METADATA="${ASSET%.tar.gz}.build.toml"
          julia --project=. -e '
            using TOML
            report = TOML.parsefile(ARGS[1])
            delete!(report, "archive_path")
            report["archive_name"] = basename(ARGS[2])
            open(ARGS[3], "w") do io
                TOML.print(io, report; sorted=true)
            end
          ' "$REPORT" "$ASSET" "$METADATA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            true
          else
            gh release create "$TAG" --title "Astrodynamics immutable resources v1" \
              --notes "Content-addressed, immutable resource archives. Assets are only added; existing names are never overwritten." \
              --latest=false
          fi
          for FILE in "$ASSET" "$METADATA"; do
            FILE_NAME=$(basename "$FILE")
            REMOTE_DIGEST=$(gh release view "$TAG" --json assets \
              --jq ".assets[] | select(.name == \"$FILE_NAME\") | .digest")
            if [ -n "$REMOTE_DIGEST" ]; then
              LOCAL_DIGEST="sha256:$(sha256sum "$FILE" | cut -d' ' -f1)"
              test "$REMOTE_DIGEST" = "$LOCAL_DIGEST" || {
                echo "Immutable asset collision for $TAG/$FILE_NAME" >&2
                exit 1
              }
              echo "Reusing verified immutable asset $TAG/$FILE_NAME"
            else
              gh release upload "$TAG" "$FILE"
            fi
          done
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Record pending private-repository binding
        if: inputs.mode == 'build'
        run: |
          echo "Published ${{ steps.publish.outputs.url }}"
          echo "Artifact binding remains pending because private GitHub release URLs cannot be fetched by Julia's standard unauthenticated artifact downloader."
          julia --project=. scripts/generate_pending_builds.jl
          julia --project=. scripts/validate_catalog.jl
