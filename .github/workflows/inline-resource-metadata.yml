name: Inline resource metadata migration

on:
  push:
    branches: [agent/inline-resource-metadata]

permissions:
  contents: write

concurrency:
  group: inline-resource-metadata-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/inline-resource-metadata
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure canonical releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r RELEASE TITLE; do
            if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --target main --latest=false --title "$TITLE" \
                --notes "Immutable data assets for the $TITLE resource family."
            fi
          done < <(julia --project=. scripts/resource_release.jl releases)

      - name: Copy every existing locked archive to its canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p migration-download
          asset_digest () {
            local RELEASE="$1"
            local ASSET="$2"
            local RELEASE_ID
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id')
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$ASSET\") | .digest"
          }

          while IFS=$'\t' read -r ID ASSET TARGET SOURCE; do
            echo "$ID: $SOURCE/$ASSET -> $TARGET/$ASSET"
            SOURCE_DIGEST=$(asset_digest "$SOURCE" "$ASSET")
            [ -n "$SOURCE_DIGEST" ] || { echo "Missing source asset $SOURCE/$ASSET"; exit 1; }
            TARGET_DIGEST=$(asset_digest "$TARGET" "$ASSET")
            if [ -n "$TARGET_DIGEST" ]; then
              test "$TARGET_DIGEST" = "$SOURCE_DIGEST"
              continue
            fi

            rm -f "migration-download/$ASSET"
            gh release download "$SOURCE" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET" --dir migration-download
            gh release upload "$TARGET" "migration-download/$ASSET" \
              --repo "$GITHUB_REPOSITORY"
            test "$(asset_digest "$TARGET" "$ASSET")" = "$SOURCE_DIGEST"
            rm -f "migration-download/$ASSET"
          done < <(julia --project=. scripts/inline_resource_metadata.jl manifest)

      - name: Inline hashes and remove lock files
        run: |
          julia --project=. scripts/inline_resource_metadata.jl apply
          rm -f Artifacts.toml catalog/ResourceLock.toml
          rm -f scripts/relocate_resource_locks.jl
          rm -f scripts/inline_resource_metadata.jl
          rm -f .github/workflows/inline-resource-metadata.yml
          julia --project=. scripts/catalog.jl validate

      - name: Commit generated catalogue metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "Inline resource hashes and remove lock files"
          git push origin HEAD:agent/inline-resource-metadata
