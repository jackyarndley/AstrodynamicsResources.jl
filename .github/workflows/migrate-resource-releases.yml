name: Organize resource releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-release-organization
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Require inline metadata layout
        shell: bash
        run: |
          test ! -f catalog/ResourceLock.toml
          test ! -f Artifacts.toml

      - name: Normalize canonical resource releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r RELEASE TITLE; do
            if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --latest=false
            else
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --target main --title "$TITLE" --latest=false \
                --notes "Immutable data assets for the $TITLE resource family."
            fi
          done < <(julia --project=. scripts/resource_release.jl releases)

      - name: Verify cached resources are in canonical releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > release-assets.txt
          while read -r RELEASE; do
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id')
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq '.[].name' |
              while read -r ASSET; do printf '%s\t%s\n' "$RELEASE" "$ASSET"; done
          done < <(julia --project=. scripts/resource_release.jl tags)
          sort -u -o release-assets.txt release-assets.txt
          julia --project=. scripts/release_audit.jl release-assets.txt

      - name: Remove undeclared assets from canonical releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          julia --project=. scripts/resource_release.jl manifest |
            cut -f2,3 | awk -F'\t' '{print $2 "\t" $1}' | sort -u > expected-assets.txt

          while read -r RELEASE; do
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id')
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv' |
              while IFS=$'\t' read -r ASSET_ID ASSET; do
                PAIR=$(printf '%s\t%s' "$RELEASE" "$ASSET")
                if ! grep -Fqx "$PAIR" expected-assets.txt; then
                  echo "Deleting undeclared asset $RELEASE/$ASSET"
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
                fi
              done
          done < <(julia --project=. scripts/resource_release.jl tags)

      - name: Remove obsolete data releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for RELEASE in \
            resources-geopotential \
            resources-ephemerides-v1 resources-satellite-ephemerides-v1 \
            resources-star-catalogues-v1 resources-geopotential-v1 \
            resources-textures-v1 resources-reference-v1 resources-shape-models-v1; do
            if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$RELEASE" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

      - name: Recreate package release without uploaded data assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v0.1.0 --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --latest \
            --title "AstrodynamicsResources.jl v0.1.0"
