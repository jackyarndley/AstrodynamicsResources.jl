name: Organize resource releases

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize with Cache resources because both workflows can create/edit releases.
concurrency:
  group: resource-release-mutations
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Require inline metadata layout
        shell: bash
        run: |
          test ! -f catalog/ResourceLock.toml
          test ! -f Artifacts.toml

      - name: Normalize canonical resource releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while IFS=$'\t' read -r RELEASE TITLE; do
            if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --latest=false
            else
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" \
                --target main --title "$TITLE" --latest=false \
                --notes "Immutable data assets for the $TITLE resource family."
            fi
          done < <(julia --project=. scripts/resource_release.jl releases)

      - name: Verify cached resources are in canonical releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > release-assets.txt
          while read -r RELEASE; do
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.id')
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq '.[].name' |
              while read -r ASSET; do printf '%s\t%s\n' "$RELEASE" "$ASSET"; done
          done < <(julia --project=. scripts/resource_release.jl tags)
          sort -u -o release-assets.txt release-assets.txt
          julia --project=. scripts/release_audit.jl release-assets.txt --strict

      - name: Report compatibility policy
        shell: bash
        run: |
          echo "Canonical release layout is valid."
          echo "No releases or assets are deleted by this workflow."
          echo "In particular, v0.1.0 is retained because released v0.1.0 code"
          echo "contains artifact URLs that still reference its uploaded data assets."
