name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1"]
        os: [ubuntu-latest, windows-latest]
    env:
      ASTRODYNAMICS_RESOURCES_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3.2.0
      - uses: julia-actions/julia-buildpkg@v1.7.0
      - uses: julia-actions/julia-runtest@v1.12.0
      - name: Validate catalogue
        run: julia --project=. scripts/catalog.jl validate

