name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1"]
        os: [ubuntu-latest, windows-latest]
    env:
      ASTRODYNAMICS_RESOURCES_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Validate catalogue
        run: julia --project=. scripts/validate_catalog.jl

