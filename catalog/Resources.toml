# Add an immutable resource with only these two fields:
#
# [[resource]]
# name = "example"
# url = "https://provider.example/path/example.dat"
#
# Set `live = true` for a rolling resource. Everything else is optional and is
# derived from the name, URL, and file extension. License terms are resolved
# from the provider-level `[licenses]` table below and can be overridden per
# resource with `license` and `license_url`.

