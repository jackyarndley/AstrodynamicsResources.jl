[[resource]]
id = "gfz_kp_ap"
aliases = []
title = "GFZ Kp and ap nowcast"
description = "Authoritative rolling geomagnetic Kp/ap product with associated daily indices."
category = "space_weather"
provider = "gfz"
version = "rolling"
backend = "scratch"
key = "gfz_kp_ap"
urls = ["https://kp.gfz.de/fileadmin/files_for_gfz_cms/Kp_ap_Ap_SN_F107_nowcast.txt"]
ttl_seconds = 900
files = [{ path = "Kp_ap_Ap_SN_F107_nowcast.txt", role = "space_weather", primary = true }]
source_filename = "Kp_ap_Ap_SN_F107_nowcast.txt"
format = "fixed-width ASCII"
minimum_size_bytes = 1000
update_strategy = "conditional_http"
allow_stale = true
conditional_requests = true
citation = "Matzka et al. (2021), doi:10.1029/2020SW002641."
license = "CC BY 4.0; embedded SILSO sunspot values CC BY-NC 4.0"
redistribution = "cache only"

